name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          phones.sort(key=lambda p: p[0])
          rt, d = phones[-1]
          print(d["udid"])
          print("Simulator:", d["name"], rt, file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Backlog_Gaming.xcodeproj \
            -scheme Backlog_Gaming \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Warnings / errors"
            grep -E "(error|warning): " xcodebuild.log | sort -u | head -50 || echo "none"
            echo
            echo "### Tests"
            grep -E "Test run with|✘|failed" xcodebuild.log | head -50 || true
          } >> "$GITHUB_STEP_SUMMARY"
          # Аннотации к файлам/строкам — видны в PR и через Checks API.
          grep -E "^/.+:[0-9]+:[0-9]+: (error|warning): " xcodebuild.log | sort -u \
            | sed -E "s|^$GITHUB_WORKSPACE/||; s/^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::\\4 file=\\1,line=\\2,col=\\3::\\5/" \
            | head -50 || true

      - name: Upload logs and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-results
          path: |
            xcodebuild.log
            TestResults.xcresult
          retention-days: 7
